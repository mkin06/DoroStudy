spring.application.name=studyfocus
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/studyfocus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

ai.service.url=${AI_SERVICE_URL:http://ai-service:8000}
ai.service.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:2000}
ai.service.read-timeout-ms=${AI_READ_TIMEOUT_MS:5000}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.session.store-type=redis
spring.session.redis.namespace=dorostudy:session

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=DOROSTUDY_SESSION
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=12h
server.forward-headers-strategy=framework

app.seed-demo-data=${SEED_DEMO_DATA:false}

ai.quota.limits.FREE=${AI_QUOTA_FREE:15}
ai.quota.limits.PREMIUM=${AI_QUOTA_PREMIUM:50}
ai.quota.plans.FREE.subject-insight-limit=${AI_FREE_SUBJECTS:1}
ai.quota.plans.FREE.history-days=${AI_FREE_HISTORY_DAYS:30}
ai.quota.plans.PREMIUM.subject-insight-limit=-1
ai.quota.plans.PREMIUM.history-days=-1
ai.quota.default-plan=FREE
ai.quota.zone=Asia/Ho_Chi_Minh
ai.insights.zone=Asia/Ho_Chi_Minh

nudge.enabled=${NUDGE_ENABLED:false}
nudge.vapid.public-key=${VAPID_PUBLIC_KEY:}
nudge.vapid.private-key=${VAPID_PRIVATE_KEY:}
nudge.vapid.subject=${VAPID_SUBJECT:mailto:admin@dorostudy.local}
nudge.push-urgency-threshold=${NUDGE_PUSH_THRESHOLD:70}
nudge.quiet-hours-from=22
nudge.quiet-hours-to=7
nudge.zone=Asia/Ho_Chi_Minh
nudge.scan-cron=0 0 * * * *

google.client-id=${GOOGLE_CLIENT_ID:}

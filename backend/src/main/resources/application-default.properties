# IDE / mvn spring-boot:run without an explicit profile: use Tomcat's in-memory HttpSession.
# Having spring-session-data-redis on the classpath otherwise makes login require Redis.
# Docker/Railway explicitly activates "docker", so it does not load this default-profile file.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h

# Public OAuth web client ID, shared with frontend/.env. IDE runs do not load root .env.
# GOOGLE_CLIENT_ID can override this when using a different Google Cloud project.
google.client-id=${GOOGLE_CLIENT_ID:135488572257-35omi5v7v3uk6h6ulmvnrk9d8fjmkp5u.apps.googleusercontent.com}
